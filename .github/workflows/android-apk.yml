name: Build Star Frontier Android APK

on:
  push:
    branches:
      - main
      - feature/deflector-core-runtime
      - architecture/modules-skeleton
      - integration/threejs-recovery
      - feature/earth-procedural-lod
      - feature/ship-orbital-landing-foundation
      - feature/character-human-model-animation
      - feature/startup-loading-login-flow
      - feature/core-runtime-foundation
      - feature/ship-management-holographic-terminal
      - feature/engineering-warp-core-foundation
      - feature/warp-stages-engineering-controls
      - fix/character-hud-startup-layout
      - fix/pilot-hud-flight-controls
      - feature/hud-profiles-editor-gameplay
      - feature/warp-dilithium-transfer-management
  pull_request:
    branches:
      - feature/core-runtime-foundation
      - feature/refinery-core-energy-final-validation
      - feature/refinery-hologram-console-interaction
      - main
      - architecture/modules-skeleton
      - integration/threejs-recovery
      - feature/earth-procedural-lod
      - feature/character-human-model-animation
      - feature/startup-loading-login-flow
      - feature/engineering-warp-core-foundation
      - fix/character-hud-startup-layout
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare Emscripten cache directory
        run: mkdir -p "${{ runner.temp }}/emsdk-cache"

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: ${{ runner.temp }}/emsdk-cache

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache NOAA ETOPO prepared grid
        uses: actions/cache@v4
        with:
          path: public/earth/data/etopo2022-global-0.25deg.bin
          key: noaa-etopo2022-global-0.25deg-v3

      - name: Install geospatial dependencies
        run: python -m pip install --disable-pip-version-check numpy netCDF4

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare NOAA ETOPO terrain data
        run: npm run prepare:earth:etopo --if-present

      - name: Compile Earth C++ kernel to WebAssembly
        run: npm run build:earth:wasm --if-present

      - name: Compile Ship C++ orbital kernel to WebAssembly
        run: npm run build:ship:wasm --if-present
      - name: Compile Dilithium Refinery C++ kernel to WebAssembly
        run: bash scripts/build-refinery-wasm.sh

      - name: Compile shared C++ gravity kernel to WebAssembly
        run: npm run build:gravity:wasm --if-present

      - name: Compile C++ core Runtime to WebAssembly
        run: npm run build:runtime:wasm --if-present

      - name: Run project tests
        run: npm test --if-present

      - name: Build Three.js web runtime
        run: npm run build

      - name: Generate and sync native Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure landscape orientation
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          tree = ET.parse(path)
          root = tree.getroot()
          android_ns = "{http://schemas.android.com/apk/res/android}"
          activity = next(
              (node for node in root.iter("activity")
               if node.get(android_ns + "name", "").endswith("MainActivity")),
              None
          )
          if activity is None:
              raise SystemExit("MainActivity not found in AndroidManifest.xml")
          activity.set(android_ns + "screenOrientation", "landscape")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Enable immersive fullscreen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          matches = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if len(matches) != 1:
              raise SystemExit(f"Expected one MainActivity.java, found {len(matches)}")
          path = matches[0]
          source = path.read_text()
          bridge_import = "import com.getcapacitor.BridgeActivity;"
          if bridge_import not in source:
              raise SystemExit("BridgeActivity import not found in MainActivity.java")
          if "import android.view.View;" not in source:
              source = source.replace(bridge_import, "import android.view.View;\n" + bridge_import)
          if "SYSTEM_UI_FLAG_IMMERSIVE_STICKY" not in source:
              method = """
              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      );
                  }
              }
          """
              position = source.rfind("}")
              if position < 0:
                  raise SystemExit("MainActivity closing brace not found")
              source = source[:position] + method + source[position:]
          path.write_text(source)
          print(f"Immersive fullscreen configured: {path}")
          PY

      - name: Restore Gradle dependencies cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json') }}-
            ${{ runner.os }}-gradle-

      - name: Compile Android APK
        working-directory: android
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            if ./gradlew --no-daemon --stacktrace --max-workers=2 assembleDebug; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              wait_seconds=$((attempt * 30))
              echo "Gradle build attempt failed; waiting ${wait_seconds} seconds before retry."
              sleep "${wait_seconds}"
            fi
          done
          echo "Gradle build failed after 3 attempts."
          exit 1

      - name: Save Gradle dependencies cache (including partial downloads)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: star-frontier-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
