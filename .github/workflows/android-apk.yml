
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, architecture/modules-skeleton ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm install

      - run: npm run build

      - run: npx cap add android

      - run: npx cap sync android

      - name: Configure fullscreen landscape
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name MainActivity.java -print -quit)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "MainActivity.java não encontrado"
            exit 1
          fi

          PACKAGE_LINE=$(grep '^package ' "$MAIN_ACTIVITY")

          printf '%s\n' "$PACKAGE_LINE" > "$MAIN_ACTIVITY"

          cat >> "$MAIN_ACTIVITY" <<'EOF'

          import android.content.pm.ActivityInfo;
          import android.os.Bundle;
          import android.view.View;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE);
                  hideSystemUI();
              }

              private void hideSystemUI() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);

                  if (hasFocus) {
                      hideSystemUI();
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: star-frontier-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
