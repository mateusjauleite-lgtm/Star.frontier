name: Build Star Frontier Three.js Android APK

on:
  push:
    branches:
      - integration/threejs-recovery
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Run project tests
        run: npm test

      - name: Build Three.js web runtime
        run: npm run build

      - name: Generate native Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Force landscape orientation
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          tree = ET.parse(path)
          root = tree.getroot()
          android_ns = "{http://schemas.android.com/apk/res/android}"
          activity = next((node for node in root.iter("activity") if node.get(android_ns + "name", "").endswith("MainActivity")), None)
          if activity is None:
              raise SystemExit("MainActivity not found in AndroidManifest.xml")
          activity.set(android_ns + "screenOrientation", "landscape")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          print("MainActivity orientation set to landscape")
          PY

      - name: Enable immersive fullscreen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/java/com/mateus/starfrontier/MainActivity.java")
          source = path.read_text()
          if "import android.view.View;" not in source:
              source = source.replace(
                  "import com.getcapacitor.BridgeActivity;",
                  "import android.view.View;" + chr(10) + "import com.getcapacitor.BridgeActivity;"
              )
          if "SYSTEM_UI_FLAG_IMMERSIVE_STICKY" not in source:
              method = """
              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      );
                  }
              }
          """
              position = source.rfind("}")
              if position < 0:
                  raise SystemExit("MainActivity closing brace not found")
              source = source[:position] + method + source[position:]
          path.write_text(source)
          print("Immersive fullscreen enabled for Android")
          PY

      - name: Compile Android APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: star-frontier-threejs-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
